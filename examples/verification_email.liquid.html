<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8" />
    <title>[My CTF] Verify your email address</title>
</head>

<body style="font-family: sans-serif;">
    <div style="max-width:600px; padding:24px;">
        <div>
            <p>
                Hi,
                <br>
                To finish creating your MyCTF account, please verify your email address.
            </p>

            <br>
            <!-- You can use whatever url you deem fit. Your website must be able to capture the token from the url -->
            <!-- and send it to the backend. -->
            <a href="https://my_ctf.com/verify_account/?t={{token}}" style="background:teal; color:white; padding:12px 18px;">
                Verify email
            </a>
            <br><br>

            <p>
                If you didn’t create an account, you can safely ignore this email.
                <br>
                The link will expire in 30 minutes.
            </p>
        </div>
    </div>
</body>

</html>
