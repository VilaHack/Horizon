# Example configuation file for Horizon
#
# Horizon will look for a configuration file at these default locations:
# - /etc/horizon/horizon.toml
# - /etc/horizon/configuration.toml
# - /etc/horizon/config.toml
# (ordered by priority)
#
# You can use an alterative configuration path by providing it as the first
# argument when running Horizon.
#
# If serialization fails, the next path by priority on the default set will
# be attempted.

[authentication]
# Random set of 32 bytes, used as the HMAC key.
key = [
  84, 75, 240, 186, 31, 133, 254, 240, 131, 113, 48, 113, 143, 10, 161, 154,
  159, 198, 80, 114, 150, 145, 51, 250, 105, 105, 134, 89, 25, 176, 131, 184
]
session_timeout_ms = 28800000 # 8 hours
domain = "my_ctf.com" # Domain the session cookie will be configured to.
                      # Subdomains of this will be able to read it.
[http]
bind_address = "0.0.0.0:8000" # Listen on all network interfaces on port 8000
allowed_origins = [
  "https://my_ctf.com",       # Set of addresses that will be attached to HTTP
  "https://admin.my_ctf.com"  # responses as allowed origins (CORS)
]

[database] # MongoDB connection string. It is mandatory to specify a database.
uri = "mongodb://horizon_db_user:super_secure_password@localhost:27017/my_ctf_db?appName=Horizon"

[smtp]
relay = "smtp.my_ctf.com" # STARTTLS SMTP Relay FQDN
credentials = {
    authentication_identity = "horizon_smtp_user",
    secret = "super_secure_password"
}

send_from = "My CTF <robot@my_ctf.com>"
reply_to = "Do not reply to this email <noreply@my_ctf.com>"

[smtp.templates]
# The `token` variable is available to the `verification` and `forgot_password`
# templates.
# The `name` variable is available to the `application_acceptance` template.
#
# HTML formatted messages must have a plaintext fallback. This is why there are
# two body templates per email type. Email clients will preferably display the
# HTML body.
verification = {
    subject = "[My CTF] Verify your email address",
    body_html = "/path/to/verification_email.liquid.html",   # Absolute file
    fallback_body = "/path/to/verification_email.liquid.txt" # path to liquid
}                                                            # template.

forgot_password = {
    subject = "[My CTF] Password reset",
    body_html = "/path/to/forgotten_password_email.liquid.html",
    fallback_body = "/path/to/forgotten_password_email.liquid.txt"
}

application_acceptance = {
    subject = "[My CTF] You've been accepted! Please confirm your attendance",
    body_html = "/path/to/application_accepted.liquid.html",
    fallback_body = "/path/to/forgotten_password_email.liquid.txt"
}                                                    

[observability]
filter = "info,horizon=trace" # Emmit all logs for Horizon and only logs of
                              # `info` level or higher for Horizon's
                              # dependencies

opentelemetry = { # Optional. Disabled if not defined
    service_name = "horizon_production", # Name that will be used to identify
    endpoint = "http://127.0.0.1:4317"   # the service on otlp 
}

# Optional. Disabled if not defined
# stderr = true
